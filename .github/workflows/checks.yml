name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NAKAMA_LOG_FILE: .nakama/logs/checks.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make verify
      - name: Measure isolated workspace reads and connection use
        if: github.event_name == 'pull_request'
        run: node --import tsx scripts/check-workspace-reads.ts
      - run: make frontend
      - name: Install Chromium for browser verification
        id: chromium
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Verify production routes
        if: github.event_name == 'pull_request'
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:frontend
      - name: Verify Storybook interactions
        if: "!cancelled() && steps.chromium.outcome == 'success'"
        env:
          STORYBOOK_STATIC: "1"
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:components
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-diagnostics
          path: .nakama/logs/checks.jsonl*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-source-maps
          path: |
            .next/BUILD_ID
            .next/nakama-build.json
            .next/server/**/*.map
          include-hidden-files: true
          retention-days: 7
